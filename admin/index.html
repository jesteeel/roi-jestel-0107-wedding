<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest List | Roi & Jestel</title><style>:root{font-family:system-ui,sans-serif;color:#f4e9d7;background:#101111}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:0 auto;padding:3rem 1rem}h1,h2{font-family:Georgia,serif;font-weight:400;color:#d9b779}input,textarea,button{font:inherit}input,textarea{width:100%;background:#1c1c1c;color:#fff;border:1px solid #9b794b;padding:.9rem;border-radius:5px}label{display:block;margin:1rem 0 .35rem}button{background:#caa56d;color:#111;border:0;padding:.85rem 1.2rem;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:transparent;color:#e3c38e;border:1px solid #9b794b}button.danger{background:#502b2b;color:#fff}article{border:1px solid #655239;margin:1rem 0;padding:1rem;border-radius:8px}.stats{display:flex;gap:1rem;flex-wrap:wrap;color:#d9b779}.stats span{border:1px solid #655239;padding:1rem;border-radius:6px}header{display:flex;justify-content:space-between;align-items:center;gap:1rem}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center}.muted{color:#b7aa98}.error{color:#ffb4a8}.members{line-height:1.8}#app[hidden],#login[hidden]{display:none}textarea{min-height:125px}</style></head><body><main><header><h1>Roi & Jestel · Guest List</h1><a href="https://jesteeel.github.io/roi-jestel-0107-wedding/" style="color:#d9b779">Wedding website</a></header><section id="login"><h2>Private access</h2><p>Enter your admin passcode. Guest management will be available after Google Sheets is connected.</p><form id="login-form"><label for="pass">Passcode</label><input id="pass" type="password" required autocomplete="current-password"><p><button>Unlock guest list</button></p></form><p id="login-message" role="status"></p></section><div id="app" hidden><div class="row"><h2>Invitations</h2><button id="logout" class="secondary">Lock admin</button></div><div class="stats" id="stats"></div><section><h2>Add a family / group</h2><form id="add-form"><label for="group-name">Family or group name</label><input id="group-name" placeholder="e.g. Santos Family" required maxlength="120"><label for="members">Invited guests (one full name per line)</label><textarea id="members" placeholder="Maria Santos&#10;Jose Santos&#10;Ana Santos" required></textarea><p><button>Add invitation</button></p></form><p id="add-message" role="status"></p></section><section><h2>Guest list & RSVP responses</h2><div id="groups"></div></section></div></main><script src="../config.js"></script><script>
// Replace with your Worker URL after deployment.
const API_BASE=window.WEDDING_API_BASE||'';
// Set the final GitHub Pages or custom domain in config.js when ready.
const INVITATION_SITE_URL=window.WEDDING_SITE_URL || new URL('../',location.href).href;
function invitationUrl(code){const url=new URL(INVITATION_SITE_URL);url.searchParams.set('invite',code);return url.toString()}
let session=sessionStorage.getItem('wedding_admin_session')||'';
const $=id=>document.getElementById(id);const show=on=>{$('login').hidden=on;$('app').hidden=!on};
async function api(path,opts={}){if(!API_BASE)throw Error('Google Sheets integration has not been configured yet.');const r=await fetch(API_BASE+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session}});const data=await r.json();if(!r.ok || data.ok===false)throw Error(data.error||'Request failed');return data;}
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-message').textContent='Checking…';try{const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({passcode:$('pass').value})});session=data.token;sessionStorage.setItem('wedding_admin_session',session);$('pass').value='';show(true);await load();$('login-message').textContent='';}catch(err){$('login-message').textContent=err.message;}};
$('logout').onclick=()=>{session='';sessionStorage.removeItem('wedding_admin_session');show(false)};
$('add-form').onsubmit=async e=>{e.preventDefault();const name=$('group-name').value.trim(),members=$('members').value.split('\n').map(s=>s.trim()).filter(Boolean);try{const existing=await api('/api/admin/groups',{method:'POST',body:JSON.stringify({operation:'list'})});const ids=existing.guests.map(g=>g.groupId);let num=1;while(ids.includes('F'+String(num).padStart(3,'0')))num++;const groupId='F'+String(num).padStart(3,'0');for(const member of members){await api('/api/admin/guest/upsert',{method:'POST',body:JSON.stringify({groupId,groupName:name,name:member,status:'Pending'})});}$('add-form').reset();$('add-message').textContent='Invitation added.';await load()}catch(err){$('add-message').textContent=err.message}};
async function load(){try{const {guests}=await api('/api/admin/groups',{method:'POST',body:JSON.stringify({operation:'list'})});const groupsMap=new Map();guests.forEach(g=>{if(!groupsMap.has(g.groupId))groupsMap.set(g.groupId,{id:g.groupId,name:g.groupName,code:g.code,members:[]});groupsMap.get(g.groupId).members.push(g)});const groups=[...groupsMap.values()];$('groups').replaceChildren();$('stats').replaceChildren();const attending=guests.filter(g=>g.status==='Attending').length;const declined=guests.filter(g=>g.status==='Declined').length;[`${groups.length} invitations`,`${guests.length} invited guests`,`${attending} attending`,`${declined} declined`,`${guests.length-attending-declined} pending`].forEach(s=>{const span=document.createElement('span');span.textContent=s;$('stats').append(span)});groups.forEach(g=>{const article=document.createElement('article');const heading=document.createElement('h3');heading.textContent=g.name;const copy=document.createElement('button');copy.className='secondary';copy.textContent='Copy invitation link';copy.onclick=async()=>{const link=invitationUrl(g.code);try{await navigator.clipboard.writeText(link);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy invitation link',1800)}catch{prompt('Copy this link:',link)}};const row=document.createElement('div');row.className='row';row.append(heading,copy);article.append(row);g.members.forEach(m=>{const line=document.createElement('div');line.className='row';const label=document.createElement('span');label.textContent=`${m.name} — ${m.status}`;const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=async()=>{const name=prompt('Guest full name',m.name);if(name===null||!name.trim())return;const status=prompt('Status: Pending, Attending, Declined',m.status);if(status===null)return;try{await api('/api/admin/guest/upsert',{method:'POST',body:JSON.stringify({guestId:m.guestId,groupId:g.id,groupName:g.name,name:name.trim(),status})});await load()}catch(e){alert(e.message)}};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+m.name+'?'))return;try{await api('/api/admin/guest/delete',{method:'POST',body:JSON.stringify({guestId:m.guestId})});await load()}catch(e){alert(e.message)}};const actions=document.createElement('div');actions.className='row';actions.append(edit,del);line.append(label,actions);article.append(line)});$('groups').append(article)})}catch(err){session='';sessionStorage.removeItem('wedding_admin_session');show(false);$('login-message').textContent=err.message}}

if(session){show(true);load()}
</script></body></html>
