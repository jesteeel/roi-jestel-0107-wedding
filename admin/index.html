<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest List | Roi & Jestel</title><style>:root{font-family:system-ui,sans-serif;color:#f4e9d7;background:#101111}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:0 auto;padding:3rem 1rem}h1,h2{font-family:Georgia,serif;font-weight:400;color:#d9b779}input,textarea,button{font:inherit}input,textarea{width:100%;background:#1c1c1c;color:#fff;border:1px solid #9b794b;padding:.9rem;border-radius:5px}label{display:block;margin:1rem 0 .35rem}button{background:#caa56d;color:#111;border:0;padding:.85rem 1.2rem;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:transparent;color:#e3c38e;border:1px solid #9b794b}button.danger{background:#502b2b;color:#fff}article{border:1px solid #655239;margin:1rem 0;padding:1rem;border-radius:8px}.stats{display:flex;gap:1rem;flex-wrap:wrap;color:#d9b779}.stats span{border:1px solid #655239;padding:1rem;border-radius:6px}header{display:flex;justify-content:space-between;align-items:center;gap:1rem}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center}.muted{color:#b7aa98}.error{color:#ffb4a8}.members{line-height:1.8}#app[hidden],#login[hidden]{display:none}textarea{min-height:125px}
main{max-width:1450px}.table-wrap{overflow-x:auto;border:1px solid #655239;border-radius:10px;margin-top:1rem}table{border-collapse:collapse;width:100%;min-width:1100px;font-size:.88rem}th,td{padding:.85rem .7rem;text-align:left;border-bottom:1px solid #453b2e;vertical-align:middle}th{background:#26221c;color:#e1bd81;white-space:nowrap;position:sticky;top:0}tbody tr:hover{background:#1b1a18}.action-group{display:flex;flex-wrap:wrap;gap:.4rem}.action-group button{padding:.45rem .6rem;font-size:.78rem;white-space:nowrap}.action-group .selected{background:#8fa68d;color:#101811}.sent-cell{text-align:center}.sent-cell input{width:18px;height:18px;accent-color:#d9b779;cursor:pointer}.sent-cell input:disabled{opacity:.5;cursor:wait}.status-pill{display:inline-block;padding:.3rem .65rem;border-radius:20px;border:1px solid #736045;white-space:nowrap}.status-pill.attending{color:#c0e2b8;border-color:#65835f}.status-pill.declined{color:#e7b3ad;border-color:#995c57}.group-cell small{display:block;color:#b7aa98;margin-top:.3rem}.table-feedback{min-height:1.4rem;color:#d9b779}button:focus-visible,input:focus-visible{outline:2px solid #e9c991;outline-offset:3px}
.family-card{margin:1.25rem 0;padding:1.25rem;border-radius:10px}.family-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.family-head h3{margin:0 0 .3rem;color:#e1bd81;font-family:Georgia,serif;font-size:1.4rem;font-weight:400}.family-head .action-group{justify-content:flex-end}.family-sent{display:inline-flex;align-items:center;gap:.4rem;margin:0;padding:.35rem .55rem;border:1px solid #9b794b;border-radius:5px;white-space:nowrap;font-size:.83rem}.family-sent input{width:17px;height:17px;accent-color:#d9b779}.family-table{min-width:500px}.small-btn{padding:.4rem .7rem;font-size:.8rem}.family-card .table-wrap{margin-top:.5rem}@media(max-width:700px){.family-head .action-group{justify-content:flex-start}.family-card{padding:.85rem}}
</style></head><body><main><header><h1>Roi & Jestel · Guest List</h1><a href="https://jesteeel.github.io/roi-jestel-0107-wedding/" style="color:#d9b779">Wedding website</a></header><section id="login"><h2>Private access</h2><p>Enter your admin passcode. Guest management will be available after Google Sheets is connected.</p><form id="login-form"><label for="pass">Passcode</label><input id="pass" type="password" required autocomplete="current-password"><p><button>Unlock guest list</button></p></form><p id="login-message" role="status"></p></section><div id="app" hidden><div class="row"><h2>Invitations</h2><button id="logout" class="secondary">Lock admin</button></div><div class="stats" id="stats"></div><section><h2>Add a family / group</h2><form id="add-form"><label for="group-name">Family or group name</label><input id="group-name" placeholder="e.g. Santos Family" required maxlength="120"><label for="members">Invited guests (one full name per line)</label><textarea id="members" placeholder="Maria Santos&#10;Jose Santos&#10;Ana Santos" required></textarea><p><button>Add invitation</button></p></form><p id="add-message" role="status"></p></section><section><h2>Guest list & RSVP responses</h2><p id="table-feedback" class="table-feedback" role="status" aria-live="polite"></p><div id="groups" class="table-wrap"></div></section></div></main><script src="../config.js"></script><script>
// Replace with your Worker URL after deployment.
const API_BASE=window.WEDDING_API_BASE||'';
// Set the final GitHub Pages or custom domain in config.js when ready.
const INVITATION_SITE_URL=window.WEDDING_SITE_URL || new URL('../',location.href).href;
function invitationUrl(code){const url=new URL(INVITATION_SITE_URL);url.searchParams.set('invite',code);return url.toString()}
let session=sessionStorage.getItem('wedding_admin_session')||'';
const $=id=>document.getElementById(id);const show=on=>{$('login').hidden=on;$('app').hidden=!on};
async function api(path,opts={}){if(!API_BASE)throw Error('Google Sheets integration has not been configured yet.');const r=await fetch(API_BASE+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session}});const data=await r.json();if(!r.ok || data.ok===false)throw Error(data.error||'Request failed');return data;}
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-message').textContent='Checking…';try{const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({passcode:$('pass').value})});session=data.token;sessionStorage.setItem('wedding_admin_session',session);$('pass').value='';show(true);await load();$('login-message').textContent='';}catch(err){$('login-message').textContent=err.message;}};
$('logout').onclick=()=>{session='';sessionStorage.removeItem('wedding_admin_session');show(false)};
$('add-form').onsubmit=async e=>{e.preventDefault();const name=$('group-name').value.trim(),members=$('members').value.split('\n').map(s=>s.trim()).filter(Boolean);try{const existing=await api('/api/admin/groups',{method:'POST',body:JSON.stringify({operation:'list'})});const ids=existing.guests.map(g=>g.groupId);let num=1;while(ids.includes('F'+String(num).padStart(3,'0')))num++;const groupId='F'+String(num).padStart(3,'0');for(const member of members){await api('/api/admin/guest/upsert',{method:'POST',body:JSON.stringify({groupId,groupName:name,name:member,status:'Pending'})});}$('add-form').reset();$('add-message').textContent='Invitation added.';await load()}catch(err){$('add-message').textContent=err.message}};
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const feedback=message=>{$('table-feedback').textContent=message};
async function copyText(value,button){try{await navigator.clipboard.writeText(value);const old=button.textContent;button.textContent='Copied!';setTimeout(()=>button.textContent=old,1600)}catch{prompt('Copy:',value)}}
async function updateGuest(m,changes){await api('/api/admin/guest/upsert',{method:'POST',body:JSON.stringify({guestId:m.guestId,groupId:m.groupId,groupName:m.groupName,name:m.name,status:m.status,...changes})});await load()}
async function load(){try{const {guests}=await api('/api/admin/groups',{method:'POST',body:JSON.stringify({operation:'list'})});const groupMap=new Map();for(const guest of guests){if(!groupMap.has(guest.groupId))groupMap.set(guest.groupId,{id:guest.groupId,name:guest.groupName,code:guest.code,members:[]});groupMap.get(guest.groupId).members.push(guest)}const groups=[...groupMap.values()];$('stats').replaceChildren();const attending=guests.filter(g=>g.status==='Attending').length,declined=guests.filter(g=>g.status==='Declined').length;[groups.length+' invitations',guests.length+' invited guests',attending+' attending',declined+' declined',(guests.length-attending-declined)+' pending'].forEach(label=>{const span=document.createElement('span');span.textContent=label;$('stats').append(span)});$('groups').className='';$('groups').replaceChildren();
for(const group of groups){const article=document.createElement('article');article.className='family-card';const head=document.createElement('div');head.className='family-head';const heading=document.createElement('div');const h3=document.createElement('h3');h3.textContent=group.name;const sub=document.createElement('small');sub.className='muted';sub.textContent=group.id+' · '+group.members.length+' invited guest'+(group.members.length===1?'':'s');heading.append(h3,sub);const actions=document.createElement('div');actions.className='action-group';const addButton=(label,action,style='secondary')=>{const btn=document.createElement('button');btn.className=style;btn.textContent=label;btn.onclick=async()=>{if(action==='link')return copyText(invitationUrl(group.code),btn);if(action==='copy')return copyText(group.code,btn);if(action==='delete'&&!confirm('Delete the entire '+group.name+' invitation and all '+group.members.length+' guests?'))return;if(action==='reset'&&!confirm('Reset RSVP responses for all guests in '+group.name+' to Pending? Their names and invitation link will be kept.'))return;btn.disabled=true;feedback('Saving changes for '+group.name+'…');try{if(action==='delete'){for(const m of group.members)await api('/api/admin/guest/delete',{method:'POST',body:JSON.stringify({guestId:m.guestId})})}else if(action==='attending'||action==='declined'||action==='reset'){const status=action==='reset'?'Pending':action==='attending'?'Attending':'Declined';for(const m of group.members)await api('/api/admin/guest/upsert',{method:'POST',body:JSON.stringify({guestId:m.guestId,groupId:m.groupId,groupName:m.groupName,name:m.name,status})})}await load();feedback('Changes saved for '+group.name+'.')}catch(err){feedback('Could not complete all changes: '+err.message);btn.disabled=false}};actions.append(btn)};addButton('Copy invitation link','link');addButton('Copy code','copy');addButton('Delete group','delete','danger');addButton('Mark all attending','attending');addButton('Mark all declined','declined');addButton('Reset RSVP','reset');const sentLabel=document.createElement('label');sentLabel.className='family-sent';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=group.members.every(m=>m.invitationSent===true);checkbox.indeterminate=!checkbox.checked&&group.members.some(m=>m.invitationSent===true);sentLabel.append(checkbox,document.createTextNode(' Invitation sent'));checkbox.onchange=async()=>{const checked=checkbox.checked;checkbox.disabled=true;feedback('Saving invitation sent status…');try{for(const m of group.members)await api('/api/admin/guest/sent',{method:'POST',body:JSON.stringify({guestId:m.guestId,invitationSent:checked})});await load();feedback('Invitation sent status saved.')}catch(err){checkbox.checked=!checked;checkbox.disabled=false;feedback('Could not save invitation sent status: '+err.message)}};const rename=document.createElement('button');rename.className='secondary';rename.textContent='Edit family name';rename.onclick=async()=>{const next=prompt('Family / group name',group.name);if(next===null)return;const newName=next.trim();if(!newName||newName===group.name)return;rename.disabled=true;feedback('Updating family name…');try{for(const member of group.members){await api('/api/admin/guest/upsert',{method:'POST',body:JSON.stringify({guestId:member.guestId,groupId:member.groupId,groupName:newName,name:member.name,status:member.status})})}await load();feedback('Family name updated to '+newName+'.')}catch(err){feedback('Family name update may be incomplete: '+err.message);rename.disabled=false}};actions.prepend(rename);actions.prepend(sentLabel);head.append(heading,actions);article.append(head);const tableWrap=document.createElement('div');tableWrap.className='table-wrap';const table=document.createElement('table');table.className='family-table';table.innerHTML='<thead><tr><th>Guest name</th><th>RSVP status</th><th>Actions</th></tr></thead><tbody></tbody>';const tbody=table.querySelector('tbody');for(const m of group.members){const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=m.name;const status=document.createElement('td');const pill=document.createElement('span');pill.className='status-pill '+(m.status||'').toLowerCase();pill.textContent=m.status||'Pending';status.append(pill);const controls=document.createElement('td');const edit=document.createElement('button');edit.className='secondary small-btn';edit.textContent='Edit';edit.onclick=async()=>{const next=prompt('Guest full name',m.name);if(next===null||!next.trim())return;try{await updateGuest(m,{name:next.trim()});feedback('Guest updated.')}catch(err){feedback(err.message)}};const del=document.createElement('button');del.className='danger small-btn';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+m.name+'?'))return;try{await api('/api/admin/guest/delete',{method:'POST',body:JSON.stringify({guestId:m.guestId})});await load();feedback('Guest deleted.')}catch(err){feedback(err.message)}};controls.append(edit,document.createTextNode(' '),del);tr.append(name,status,controls);tbody.append(tr)}tableWrap.append(table);article.append(tableWrap);$('groups').append(article)}
}catch(err){feedback(err.message);if(/session expired|unauthorized|invalid token/i.test(err.message)){session='';sessionStorage.removeItem('wedding_admin_session');show(false);$('login-message').textContent=err.message}}}

if(session){show(true);load()}
</script></body></html>
